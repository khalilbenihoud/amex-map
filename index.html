<head>

    <title>Guide des Restaurants - Tables en France</title>
    <meta name="description"
        content="Explorez une carte éditoriale de restaurants en France, avec filtres par cuisine et distinctions.">
    <meta name="keywords"
        content="restaurants France, carte restaurants, gastronomie, Michelin, guide restaurants">
    <meta name="author" content="Guide des Restaurants">
    <meta name="robots" content="index, follow">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

    <!-- Preload critical resources -->
    <link rel="preload" href="style.css?v=20260607-fr" as="style">
    <link rel="preload" href="script.js?v=20260607-fr" as="script">
    <link rel="preload" href="data/restaurants.json" as="fetch" crossorigin>

    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://www.google-analytics.com">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Guide des Restaurants - Tables en France">
    <meta property="og:description"
        content="Carte interactive de restaurants en France, avec filtres par cuisine et distinctions.">
    <meta property="og:image" content="og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Carte éditoriale de restaurants en France">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:locale" content="fr_FR">
    <meta property="og:site_name" content="Guide des Restaurants">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Guide des Restaurants - Tables en France">
    <meta property="twitter:description"
        content="Carte interactive de restaurants en France, avec filtres par cuisine et distinctions.">
    <meta property="twitter:image" content="og-image.jpg">

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Guide des Restaurants",
      "description": "Carte interactive de restaurants en France.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ItemList Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Restaurants en France",
      "description": "Collection éditoriale de restaurants en France",
      "numberOfItems": 163
    }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Local CSS -->
    <link rel="stylesheet" href="style.css?v=20260607-fr">
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <div class="floating-search-header">
                <header class="header">
                    <a href="/" class="brand" style="text-decoration: none;">
                        Guide des Restaurants
                    </a>
                    <h1 class="title">Tables de France</h1>
                    <div class="header-actions">
                        <p class="subtitle">Sélection éditoriale</p>
                    </div>
                </header>

                <div id="search-container">
                    <div class="search-wrapper">
                        <svg class="icon search-icon" viewBox="0 0 24 24">
                            <path
                                d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                        </svg>
                        <input type="text" id="restaurant-search" placeholder="Rechercher un restaurant, une ville, une cuisine...">
                        <svg class="icon clear-search" id="clear-search" viewBox="0 0 24 24">
                            <path
                                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                        </svg>
                    </div>
                </div>
            </div>

            <section class="results-sheet">
                <div class="sheet-handle" aria-hidden="true"></div>

                <div id="filters-container" class="filters-container">
                    <div class="filters-meta">
                        <span id="result-count" class="result-count">0 restaurant</span>
                        <button id="clear-all-filters" class="clear-all-filters" type="button">Réinitialiser</button>
                    </div>

                    <div class="filter-section">
                        <div class="filter-label">Distinction</div>
                        <div id="stars-filter" class="chip-row" role="group" aria-label="Filtrer par distinction">
                            <button class="filter-chip active" type="button" data-filter-type="stars" data-filter-value="">Toutes</button>
                            <button class="filter-chip" type="button" data-filter-type="stars" data-filter-value="starred">Michelin</button>
                            <button class="filter-chip" type="button" data-filter-type="stars" data-filter-value="3 Stars">3 étoiles</button>
                            <button class="filter-chip" type="button" data-filter-type="stars" data-filter-value="2 Stars">2 étoiles</button>
                            <button class="filter-chip" type="button" data-filter-type="stars" data-filter-value="1 Star">1 étoile</button>
                            <button class="filter-chip" type="button" data-filter-type="stars" data-filter-value="null">Sans étoile</button>
                        </div>
                    </div>

                    <div class="filter-section">
                        <div class="filter-label">Cuisine</div>
                        <div id="cuisine-filter" class="chip-row" role="group" aria-label="Filtrer par cuisine">
                            <button class="filter-chip active" type="button" data-filter-type="cuisine" data-filter-value="">Toutes les cuisines</button>
                        </div>
                    </div>
                </div>

                <div id="restaurant-list" class="restaurant-list">
                    <!-- Restaurant items will be populated by JS -->
                </div>
            </section>
        </aside>

        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>

    <!-- Local JS -->
    <script src="script.js?v=20260607-fr" defer></script>
</body>

</html>
